[package]
name = "pls_bitcoin_wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.92"
bitcoin = { version = "0.32.6", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
hex = { version = "0.4", features = ["serde"] }
base64 = "0.22.1"
console_error_panic_hook = "0.1.7"
serde_json = "1.0.140"
js-sys = "0.3.77"

[dev-dependencies]
wasm-bindgen-test = "0.3.42"
serde_json = "1.0" # For creating complex JsValue in tests if needed

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

